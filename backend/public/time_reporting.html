<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SGTV - Reporte de Horas</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body class="animate-fade-in">

    <div class="dashboard-container">
        <header class="topbar">
            <div class="brand">
                <a href="dashboard.html" style="text-decoration: none; color: inherit; display: flex; align-items: center; gap: 12px;">
                    <div class="logo">SG</div>
                    <div>
                        <h1 style="font-size: 18px; margin: 0; font-weight: 700;">SGTV</h1>
                        <div style="font-size: 12px; color: var(--text-muted);">Reporte de Horas</div>
                    </div>
                </a>
            </div>
            <div class="top-actions">
                <a href="dashboard.html" class="btn-logout-modern">
                    <i class="fa-solid fa-arrow-left"></i>
                    <span>Volver</span>
                </a>
            </div>
        </header>

        <main style="margin-top: 30px;">
            <section class="profile-card" style="padding: 30px;">
                <div style="display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 25px;">
                    <div>
                        <h2 style="margin: 0; font-size: 24px; font-weight: 700;">Registro Semanal</h2>
                        <div style="color: var(--text-muted); margin-top: 5px;">
                            Empleado: <strong style="color: var(--text-main);">Camilo Andres Ramirez</strong>
                        </div>
                    </div>
                    <div style="display: flex; gap: 15px; align-items: center;">
                        <div class="input-group-custom" style="margin-bottom: 0; padding: 5px 12px;">
                            <i class="fa-regular fa-calendar" style="margin-right: 8px; color: var(--primary);"></i>
                            <input type="date" id="datePicker" class="form-control-custom" style="width: auto; font-weight: 600; cursor: pointer;">
                        </div>
                        <div class="badge-total-modern" id="weekTotal">Total: 0h</div>
                    </div>
                </div>

                <div style="display: flex; justify-content: space-between; align-items: center; background: #fcfcfc; padding: 15px; border-radius: 12px; margin-bottom: 20px;">
                    <div style="display: flex; gap: 10px;">
                        <button class="btn-secondary-small" onclick="clearTable()">Limpiar</button>
                    </div>
                </div>

                <div style="overflow-x: auto;">
                    <table class="reporting-table">
                        <thead>
                            <tr>
                                <th style="text-align: left; width: 250px;">Proyecto / Descripción</th>
                                <th>MI</th><th>JU</th><th>VI</th><th>SÁ</th><th>DO</th><th>LU</th><th>MA</th>
                                <th>TOTAL</th>
                            </tr>
                        </thead>
                        <tbody id="timeBody">
                        </tbody>
                        <tfoot class="reporting-tfoot">
                            <tr>
                                <td style="text-align: left; font-weight: 700;">Total por día</td>
                                <td id="totMI">0</td><td id="totJU">0</td><td id="totVI">0</td>
                                <td id="totSA">0</td><td id="totDO">0</td><td id="totLU">0</td>
                                <td id="totMA">0</td>
                                <td id="grandTotal" style="color: var(--primary); font-weight: 800;">0</td>
                            </tr>
                        </tfoot>
                    </table>
                </div>

                <div style="display: flex; gap: 12px; justify-content: flex-end; margin-top: 30px; border-top: 1px solid var(--border-color); padding-top: 20px;">
                    <a href="dashboard.html" class="btn-logout-modern" style="border: none;">Cancelar</a>
                    <button class="btn-primary-custom" style="width: auto; padding: 12px 40px;" onclick="submitReport()">Enviar Reporte</button>
                </div>
            </section>
        </main>
    </div>

    <div id="modal" class="modal-backdrop hidden">
        <div class="profile-card" style="max-width: 400px; width: 90%; text-align: center;">
            <i class="fa-solid fa-circle-check" style="font-size: 48px; color: #27ae60; margin-bottom: 20px;"></i>
            <h3 id="modalTitle" style="margin-bottom: 10px;">¡Éxito!</h3>
            <p id="modalMsg" style="color: var(--text-muted); margin-bottom: 25px;"></p>
            <button class="btn-primary-custom" onclick="closeModal()">Entendido</button>
        </div>
    </div>

    <script src="js/common.js"></script>
    <script src="js/time-reporting.js"></script>
</body>
</html>
